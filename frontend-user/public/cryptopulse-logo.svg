<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <!-- Gradients -->
    <linearGradient id="limeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#65a30d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a3e635;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Background Circle -->
  <circle cx="70" cy="80" r="55" fill="#111111" stroke="url(#limeGradient)" stroke-width="3" filter="url(#glowFilter)"/>
  
  <!-- Inner glow -->
  <circle cx="70" cy="80" r="50" fill="url(#limeGlow)"/>
  
  <!-- Trading Chart Pattern (Upward trend) -->
  <polyline points="35,105 50,85 65,95 80,65 95,75 110,45" 
    fill="none" stroke="url(#limeGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow head -->
  <polygon points="110,45 105,55 115,48" fill="url(#limeGradient)"/>
  
  <!-- Decorative dots on chart points -->
  <circle cx="50" cy="85" r="3" fill="#a3e635"/>
  <circle cx="80" cy="65" r="3" fill="#a3e635"/>
  <circle cx="110" cy="45" r="3" fill="#a3e635"/>
  
  <!-- Pulse line (heartbeat style) -->
  <polyline points="35,115 50,115 55,100 65,130 75,100 85,115 105,115" 
    fill="none" stroke="url(#limeGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Text Section -->
  <text x="145" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="url(#textGradient)">
    CRYPTO
  </text>
  
  <text x="145" y="105" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="5" fill="url(#limeGradient)" filter="url(#glowFilter)">
    PULSE
  </text>
  
  <!-- Decorative line under text -->
  <line x1="145" y1="115" x2="450" y2="115" stroke="url(#limeGradient)" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="145" y="135" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="5" fill="#64748b">
    CRYPTO TRADING PLATFORM
  </text>
  
  <!-- Small decorative elements -->
  <rect x="145" y="143" width="4" height="4" rx="1" fill="#a3e635" opacity="0.6"/>
  <rect x="155" y="143" width="4" height="4" rx="1" fill="#a3e635" opacity="0.4"/>
  <rect x="165" y="143" width="4" height="4" rx="1" fill="#a3e635" opacity="0.2"/>
</svg>